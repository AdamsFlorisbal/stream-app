plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deckcontrol.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.deckcontrol.app"
        // Android 7.0: cobre praticamente qualquer tablet ainda em uso.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // O APK de depuracao ja vem assinado com a chave de debug, entao
            // instala direto no tablet sem nenhum passo extra.
            applicationIdSuffix ""
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core:1.13.1'
}
