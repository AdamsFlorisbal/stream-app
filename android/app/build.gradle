plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deckcontrol.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.deckcontrol.app"
        // Android 7.0: cobre praticamente qualquer tablet ainda em uso.
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            // O APK de depuracao ja vem assinado com a chave de debug, entao
            // instala direto no tablet sem nenhum passo extra.
            applicationIdSuffix ""
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.core:core:1.13.1'
}

// O projeto e' Java puro, mas essas libs do AndroidX trazem o Kotlin stdlib
// por baixo. Parte da arvore de dependencias ainda pede as variantes
// separadas kotlin-stdlib-jdk7/jdk8 (1.6.21), que desde o Kotlin 1.8 vivem
// dentro do proprio kotlin-stdlib — sem forcar a mesma versao, as duas
// copias coexistem e o build falha com "Duplicate class kotlin.*".
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
